name: Build Android APK + Bedrock Add-On

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK and .mcaddon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The hosted runner already contains Android command-line tools.
      # Accept licenses non-interactively and install only the SDK components needed
      # by this project; setup-android@v3 previously stopped at an interactive prompt.
      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate block texture
        run: python3 scripts/generate_texture.py

      - name: Validate add-on JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = [
              "addon/behavior_pack/manifest.json",
              "addon/behavior_pack/blocks/controller.json",
              "addon/resource_pack/manifest.json",
              "addon/resource_pack/blocks.json",
              "addon/resource_pack/textures/terrain_texture.json",
          ]
          for item in files:
              json.loads(Path(item).read_text(encoding="utf-8"))
              print("JSON OK:", item)
          PY

      - name: Build Android APK
        run: gradle --no-daemon assembleDebug

      - name: Package Bedrock Add-On and APK
        shell: bash
        run: |
          mkdir -p dist
          (cd addon && zip -qr ../dist/minecraft-linkblocks.mcaddon behavior_pack resource_pack)
          cp app/build/outputs/apk/debug/app-debug.apk dist/Minecraft-LinkBlocks-debug.apk
          sha256sum dist/* > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-linkblocks-build
          path: dist/*
          if-no-files-found: error
          retention-days: 30
